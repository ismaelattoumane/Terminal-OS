services:
  postgres:
    image: postgres:16-alpine
    container_name: terminal-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: terminal_os
      POSTGRES_USER: terminal_os
      POSTGRES_PASSWORD: terminal_os_dev
    ports:
      - "5432:5432"
    volumes:
      - terminal_os_postgres_data:/var/lib/postgresql/data

volumes:
  terminal_os_postgres_data: